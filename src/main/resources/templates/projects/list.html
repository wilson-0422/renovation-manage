<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>改造立项列表</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand"><a th:href="@{/dashboard}">老旧小区改造管控系统</a></div>
        <div class="navbar-menu">
            <a th:href="@{/dashboard}" class="nav-link">仪表盘</a>
            <a th:href="@{/projects}" class="nav-link active">改造立项</a>
            <a th:href="@{/consultations}" class="nav-link">住户征询</a>
            <a th:href="@{/construction}" class="nav-link">施工节点</a>
            <a th:href="@{/materials}" class="nav-link">材料验收</a>
            <a th:href="@{/archives}" class="nav-link">改造档案</a>
            <a th:href="@{/maintenance}" class="nav-link">维保回访</a>
        </div>
    </nav>
    <main class="main-content">
        <div class="page-header">
            <h2>改造立项管理</h2>
            <a th:href="@{/projects/create}" class="btn btn-primary">新建项目</a>
        </div>
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>项目名称</th>
                        <th>地址</th>
                        <th>预算(万元)</th>
                        <th>状态</th>
                        <th>负责人</th>
                        <th>开始日期</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="project : ${projects}">
                        <td><a th:href="@{/projects/{id}(id=${project.id})}" th:text="${project.name}"></a></td>
                        <td th:text="${project.address}"></td>
                        <td th:text="${project.budget}"></td>
                        <td>
                            <span class="status-badge" th:classappend="${project.status == '已完成'} ? 'status-success' : (${project.status == '进行中'} ? 'status-warning' : 'status-info')" th:text="${project.status}"></span>
                        </td>
                        <td th:text="${project.responsiblePerson}"></td>
                        <td th:text="${project.startDate}"></td>
                        <td class="action-cell">
                            <a th:href="@{/projects/{id}(id=${project.id})}" class="btn btn-sm btn-info">查看</a>
                            <a th:href="@{/projects/{id}/edit(id=${project.id})}" class="btn btn-sm btn-warning">编辑</a>
                            <form th:action="@{/projects/{id}/delete(id=${project.id})}" method="post" style="display:inline">
                                <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('确认删除此项目？')">删除</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    <footer class="footer">
        <p>&copy; 2026 老旧小区改造全流程管控系统 版权所有</p>
    </footer>
</body>
</html>
