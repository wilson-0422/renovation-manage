<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <h2>老旧小区改造管控系统</h2>
            <h3>用户注册</h3>
            <div th:if="${error}" class="alert alert-error">
                <span th:text="${error}"></span>
            </div>
            <form th:action="@{/auth/register}" th:object="${user}" method="post">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" th:field="*{username}" required class="form-control" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" th:field="*{password}" required class="form-control" placeholder="请输入密码">
                </div>
                <div class="form-group">
                    <label for="displayName">姓名</label>
                    <input type="text" id="displayName" th:field="*{displayName}" required class="form-control" placeholder="请输入姓名">
                </div>
                <button type="submit" class="btn btn-primary btn-block">注册</button>
            </form>
            <div class="auth-footer">
                <p>已有账号？<a th:href="@{/auth/login}">立即登录</a></p>
            </div>
        </div>
    </div>
</body>
</html>
