<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>住户征询列表</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand"><a th:href="@{/dashboard}">老旧小区改造管控系统</a></div>
        <div class="navbar-menu">
            <a th:href="@{/dashboard}" class="nav-link">仪表盘</a>
            <a th:href="@{/projects}" class="nav-link">改造立项</a>
            <a th:href="@{/consultations}" class="nav-link active">住户征询</a>
            <a th:href="@{/construction}" class="nav-link">施工节点</a>
            <a th:href="@{/materials}" class="nav-link">材料验收</a>
            <a th:href="@{/archives}" class="nav-link">改造档案</a>
            <a th:href="@{/maintenance}" class="nav-link">维保回访</a>
        </div>
    </nav>
    <main class="main-content">
        <div class="page-header">
            <h2>住户征询管理</h2>
            <a th:href="@{/consultations/create}" class="btn btn-primary">新增征询</a>
        </div>
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>住户姓名</th>
                        <th>联系电话</th>
                        <th>住址</th>
                        <th>征询意见</th>
                        <th>状态</th>
                        <th>征询日期</th>
                        <th>采集人</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${consultations}">
                        <td th:text="${c.residentName}"></td>
                        <td th:text="${c.residentPhone}"></td>
                        <td th:text="${c.address}"></td>
                        <td>
                            <span class="status-badge" th:classappend="${c.opinion == '同意'} ? 'status-success' : (${c.opinion == '反对'} ? 'status-danger' : 'status-warning')" th:text="${c.opinion}"></span>
                        </td>
                        <td>
                            <span class="status-badge" th:classappend="${c.status == '已完成'} ? 'status-success' : 'status-info'" th:text="${c.status}"></span>
                        </td>
                        <td th:text="${c.consultationDate}"></td>
                        <td th:text="${c.collector}"></td>
                        <td class="action-cell">
                            <a th:href="@{/consultations/{id}(id=${c.id})}" class="btn btn-sm btn-info">查看</a>
                            <form th:action="@{/consultations/{id}/delete(id=${c.id})}" method="post" style="display:inline">
                                <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('确认删除？')">删除</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    <footer class="footer"><p>&copy; 2026 老旧小区改造全流程管控系统 版权所有</p></footer>
</body>
</html>
