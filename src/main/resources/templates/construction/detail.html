<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>施工节点详情</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand"><a th:href="@{/dashboard}">老旧小区改造管控系统</a></div>
        <div class="navbar-menu">
            <a th:href="@{/dashboard}" class="nav-link">仪表盘</a>
            <a th:href="@{/projects}" class="nav-link">改造立项</a>
            <a th:href="@{/consultations}" class="nav-link">住户征询</a>
            <a th:href="@{/construction}" class="nav-link active">施工节点</a>
            <a th:href="@{/materials}" class="nav-link">材料验收</a>
            <a th:href="@{/archives}" class="nav-link">改造档案</a>
            <a th:href="@{/maintenance}" class="nav-link">维保回访</a>
        </div>
    </nav>
    <main class="main-content">
        <div class="page-header">
            <h2>施工节点详情</h2>
            <a th:href="@{/construction}" class="btn btn-secondary">返回列表</a>
        </div>
        <div class="detail-card">
            <div class="detail-grid">
                <div class="detail-item">
                    <label>所属项目</label>
                    <span th:text="${project.name}"></span>
                </div>
                <div class="detail-item">
                    <label>节点名称</label>
                    <span th:text="${node.nodeName}"></span>
                </div>
                <div class="detail-item">
                    <label>节点类型</label>
                    <span th:text="${node.nodeType}"></span>
                </div>
                <div class="detail-item">
                    <label>状态</label>
                    <span class="status-badge" th:classappend="${node.status == '已完成'} ? 'status-success' : (${node.status == '进行中'} ? 'status-warning' : 'status-info')" th:text="${node.status}"></span>
                </div>
                <div class="detail-item">
                    <label>计划开始日期</label>
                    <span th:text="${node.plannedStart}"></span>
                </div>
                <div class="detail-item">
                    <label>计划结束日期</label>
                    <span th:text="${node.plannedEnd}"></span>
                </div>
                <div class="detail-item">
                    <label>实际开始日期</label>
                    <span th:text="${node.actualStart}"></span>
                </div>
                <div class="detail-item">
                    <label>实际结束日期</label>
                    <span th:text="${node.actualEnd}"></span>
                </div>
                <div class="detail-item">
                    <label>监理人</label>
                    <span th:text="${node.supervisor}"></span>
                </div>
                <div class="detail-item full-width">
                    <label>描述</label>
                    <span th:text="${node.description}"></span>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer"><p>&copy; 2026 老旧小区改造全流程管控系统 版权所有</p></footer>
</body>
</html>
