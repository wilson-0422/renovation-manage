<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="zh-CN">
<head>
    <meta charset="UTF-8">
</head>
<body>
<nav th:fragment="header" class="navbar">
    <div class="navbar-brand">
        <a th:href="@{/dashboard}">老旧小区改造管控系统</a>
    </div>
    <div class="navbar-menu">
        <a th:href="@{/dashboard}" class="nav-link">仪表盘</a>
        <a th:href="@{/projects}" class="nav-link">改造立项</a>
        <a th:href="@{/consultations}" class="nav-link">住户征询</a>
        <a th:href="@{/construction}" class="nav-link">施工节点</a>
        <a th:href="@{/materials}" class="nav-link">材料验收</a>
        <a th:href="@{/archives}" class="nav-link">改造档案</a>
        <a th:href="@{/maintenance}" class="nav-link">维保回访</a>
    </div>
    <div class="navbar-user" sec:authorize="isAuthenticated()">
        <span sec:authentication="name">用户</span>
        <form th:action="@{/auth/logout}" method="post" class="logout-form">
            <button type="submit" class="btn btn-sm">退出</button>
        </form>
    </div>
</nav>
</body>
</html>
