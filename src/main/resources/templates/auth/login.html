<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <h2>老旧小区改造管控系统</h2>
            <h3>用户登录</h3>
            <div th:if="${error}" class="alert alert-error">
                <span th:text="${error}"></span>
            </div>
            <div th:if="${message}" class="alert alert-success">
                <span th:text="${message}"></span>
            </div>
            <form th:action="@{/auth/login}" method="post">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" required class="form-control" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" required class="form-control" placeholder="请输入密码">
                </div>
                <button type="submit" class="btn btn-primary btn-block">登录</button>
            </form>
            <div class="auth-footer">
                <p>还没有账号？<a th:href="@{/auth/register}">立即注册</a></p>
                <p class="hint">默认账号: admin / admin123</p>
            </div>
        </div>
    </div>
</body>
</html>
