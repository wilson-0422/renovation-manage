<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑项目</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand"><a th:href="@{/dashboard}">老旧小区改造管控系统</a></div>
        <div class="navbar-menu">
            <a th:href="@{/dashboard}" class="nav-link">仪表盘</a>
            <a th:href="@{/projects}" class="nav-link active">改造立项</a>
            <a th:href="@{/consultations}" class="nav-link">住户征询</a>
            <a th:href="@{/construction}" class="nav-link">施工节点</a>
            <a th:href="@{/materials}" class="nav-link">材料验收</a>
            <a th:href="@{/archives}" class="nav-link">改造档案</a>
            <a th:href="@{/maintenance}" class="nav-link">维保回访</a>
        </div>
    </nav>
    <main class="main-content">
        <div class="page-header">
            <h2>编辑改造项目</h2>
            <a th:href="@{/projects}" class="btn btn-secondary">返回列表</a>
        </div>
        <div class="form-card">
            <form th:action="@{/projects/{id}(id=${project.id})}" th:object="${project}" method="post">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">项目名称 <span class="required">*</span></label>
                        <input type="text" id="name" th:field="*{name}" required class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="address">项目地址 <span class="required">*</span></label>
                        <input type="text" id="address" th:field="*{address}" required class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="budget">项目预算(万元) <span class="required">*</span></label>
                        <input type="number" id="budget" th:field="*{budget}" step="0.01" required class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="status">项目状态 <span class="required">*</span></label>
                        <select id="status" th:field="*{status}" class="form-control">
                            <option value="立项中">立项中</option>
                            <option value="征询中">征询中</option>
                            <option value="进行中">进行中</option>
                            <option value="已完工">已完工</option>
                            <option value="已完成">已完成</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="totalHouseholds">总户数</label>
                        <input type="number" id="totalHouseholds" th:field="*{totalHouseholds}" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="responsiblePerson">负责人</label>
                        <input type="text" id="responsiblePerson" th:field="*{responsiblePerson}" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="contactPhone">联系电话</label>
                        <input type="text" id="contactPhone" th:field="*{contactPhone}" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="startDate">开始日期</label>
                        <input type="date" id="startDate" th:field="*{startDate}" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="endDate">结束日期</label>
                        <input type="date" id="endDate" th:field="*{endDate}" class="form-control">
                    </div>
                    <div class="form-group full-width">
                        <label for="description">项目描述</label>
                        <textarea id="description" th:field="*{description}" class="form-control" rows="4"></textarea>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">保存</button>
                    <a th:href="@{/projects/{id}(id=${project.id})}" class="btn btn-secondary">取消</a>
                </div>
            </form>
        </div>
    </main>
    <footer class="footer">
        <p>&copy; 2026 老旧小区改造全流程管控系统 版权所有</p>
    </footer>
</body>
</html>
