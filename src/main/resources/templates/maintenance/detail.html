<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>维保回访详情</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand"><a th:href="@{/dashboard}">老旧小区改造管控系统</a></div>
        <div class="navbar-menu">
            <a th:href="@{/dashboard}" class="nav-link">仪表盘</a>
            <a th:href="@{/projects}" class="nav-link">改造立项</a>
            <a th:href="@{/consultations}" class="nav-link">住户征询</a>
            <a th:href="@{/construction}" class="nav-link">施工节点</a>
            <a th:href="@{/materials}" class="nav-link">材料验收</a>
            <a th:href="@{/archives}" class="nav-link">改造档案</a>
            <a th:href="@{/maintenance}" class="nav-link active">维保回访</a>
        </div>
    </nav>
    <main class="main-content">
        <div class="page-header">
            <h2>维保回访详情</h2>
            <a th:href="@{/maintenance}" class="btn btn-secondary">返回列表</a>
        </div>
        <div class="detail-card">
            <div class="detail-grid">
                <div class="detail-item">
                    <label>所属项目</label>
                    <span th:text="${project.name}"></span>
                </div>
                <div class="detail-item">
                    <label>回访类型</label>
                    <span th:text="${visit.visitType}"></span>
                </div>
                <div class="detail-item">
                    <label>被访人姓名</label>
                    <span th:text="${visit.visitorName}"></span>
                </div>
                <div class="detail-item">
                    <label>联系电话</label>
                    <span th:text="${visit.visitorPhone}"></span>
                </div>
                <div class="detail-item">
                    <label>回访结果</label>
                    <span class="status-badge" th:classappend="${visit.visitResult == '满意'} ? 'status-success' : (${visit.visitResult == '不满意'} ? 'status-danger' : 'status-warning')" th:text="${visit.visitResult}"></span>
                </div>
                <div class="detail-item">
                    <label>回访日期</label>
                    <span th:text="${visit.visitDate}"></span>
                </div>
                <div class="detail-item">
                    <label>下次回访日期</label>
                    <span th:text="${visit.nextVisitDate}"></span>
                </div>
                <div class="detail-item">
                    <label>回访人</label>
                    <span th:text="${visit.visitor}"></span>
                </div>
                <div class="detail-item full-width">
                    <label>反馈内容</label>
                    <span th:text="${visit.feedback}"></span>
                </div>
                <div class="detail-item full-width">
                    <label>备注</label>
                    <span th:text="${visit.remark}"></span>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer"><p>&copy; 2026 老旧小区改造全流程管控系统 版权所有</p></footer>
</body>
</html>
