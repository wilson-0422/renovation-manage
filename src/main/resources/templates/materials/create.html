<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增材料验收</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand"><a th:href="@{/dashboard}">老旧小区改造管控系统</a></div>
        <div class="navbar-menu">
            <a th:href="@{/dashboard}" class="nav-link">仪表盘</a>
            <a th:href="@{/projects}" class="nav-link">改造立项</a>
            <a th:href="@{/consultations}" class="nav-link">住户征询</a>
            <a th:href="@{/construction}" class="nav-link">施工节点</a>
            <a th:href="@{/materials}" class="nav-link active">材料验收</a>
            <a th:href="@{/archives}" class="nav-link">改造档案</a>
            <a th:href="@{/maintenance}" class="nav-link">维保回访</a>
        </div>
    </nav>
    <main class="main-content">
        <div class="page-header">
            <h2>新增材料验收</h2>
            <a th:href="@{/materials}" class="btn btn-secondary">返回列表</a>
        </div>
        <div class="form-card">
            <form th:action="@{/materials}" th:object="${material}" method="post">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="projectId">所属项目 <span class="required">*</span></label>
                        <select id="projectId" th:field="*{projectId}" class="form-control" required>
                            <option value="">请选择项目</option>
                            <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="nodeId">施工节点 <span class="required">*</span></label>
                        <select id="nodeId" th:field="*{nodeId}" class="form-control" required>
                            <option value="">请选择施工节点</option>
                            <option th:each="n : ${nodes}" th:value="${n.id}" th:text="${n.nodeName}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="materialName">材料名称 <span class="required">*</span></label>
                        <input type="text" id="materialName" th:field="*{materialName}" required class="form-control" placeholder="请输入材料名称">
                    </div>
                    <div class="form-group">
                        <label for="specification">规格 <span class="required">*</span></label>
                        <input type="text" id="specification" th:field="*{specification}" required class="form-control" placeholder="请输入规格型号">
                    </div>
                    <div class="form-group">
                        <label for="brand">品牌 <span class="required">*</span></label>
                        <input type="text" id="brand" th:field="*{brand}" required class="form-control" placeholder="请输入品牌">
                    </div>
                    <div class="form-group">
                        <label for="quantity">数量 <span class="required">*</span></label>
                        <input type="number" id="quantity" th:field="*{quantity}" required class="form-control" placeholder="请输入数量">
                    </div>
                    <div class="form-group">
                        <label for="unitPrice">单价(元) <span class="required">*</span></label>
                        <input type="number" id="unitPrice" th:field="*{unitPrice}" step="0.01" required class="form-control" placeholder="请输入单价">
                    </div>
                    <div class="form-group">
                        <label for="acceptanceResult">验收结果 <span class="required">*</span></label>
                        <select id="acceptanceResult" th:field="*{acceptanceResult}" class="form-control">
                            <option value="合格">合格</option>
                            <option value="不合格">不合格</option>
                            <option value="待检验">待检验</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="acceptanceDate">验收日期</label>
                        <input type="date" id="acceptanceDate" th:field="*{acceptanceDate}" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="inspector">检验人</label>
                        <input type="text" id="inspector" th:field="*{inspector}" class="form-control" placeholder="请输入检验人">
                    </div>
                    <div class="form-group full-width">
                        <label for="remark">备注</label>
                        <textarea id="remark" th:field="*{remark}" class="form-control" rows="3" placeholder="请输入备注"></textarea>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">提交</button>
                    <a th:href="@{/materials}" class="btn btn-secondary">取消</a>
                </div>
            </form>
        </div>
    </main>
    <footer class="footer"><p>&copy; 2026 老旧小区改造全流程管控系统 版权所有</p></footer>
</body>
</html>
